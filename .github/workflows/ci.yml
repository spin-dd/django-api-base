name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # poetry.lock は Poetry 2.2.1 (lock-version 2.1) 生成。Poetry 1.x では読めない。
  POETRY_VERSION: "2.2.1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ロック版の Django は 3.2.25 で、3.11+ では動かない。
        # pyproject の `^3.9` の実効上限は 3.10。
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      # lock を正とする。--no-update 相当の解決しか行わせない。
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        run: poetry run pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      # ruff はロック版 (0.9.10)。ローカルの devenv と同じ版で判定させる。
      - name: Install dev dependencies
        run: poetry install --no-interaction --only dev --no-root

      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .
