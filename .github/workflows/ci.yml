name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # poetry.lock は Poetry 2.2.1 (lock-version 2.1) 生成。Poetry 1.x では読めない。
  POETRY_VERSION: "2.2.1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ロック版の Django は 3.2.25 で、3.11+ では動かない。
        # pyproject の `^3.9` の実効上限は 3.10。
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v7

      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      # setup-python の出力 (パッチ版まで) をキーに含める。`matrix.python-version`
      # (= "3.10") だと runner イメージが 3.10.21 → 3.10.22 に上がってもキーが変わらず、
      # 消えたインタプリタを指す .venv がそのまま復元されて以後ずっと失敗する。
      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      # lock を正とする。--no-update 相当の解決しか行わせない。
      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        run: poetry run pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Use an in-project virtualenv
        run: poetry config virtualenvs.in-project true

      # Python の版をキーに入れないと、上の python-version を変えてもキャッシュが
      # 効いてしまい、古い Python 用の .venv がそのまま使われる。poetry は再利用する
      # in-project venv を pyproject の `^3.9` としか照合しないので黙って通る。
      - name: Cache virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      # ruff は poetry.lock の版 (0.9.10)。devenv の git-hooks / treefmt は PATH の
      # `pkgs.ruff` (nixpkgs 由来で別版) を使うため、ローカルと CI の判定は一致しない。
      - name: Install dev dependencies
        run: poetry install --no-interaction --only dev --no-root

      - name: ruff check
        run: poetry run ruff check .

      - name: ruff format --check
        run: poetry run ruff format --check .
