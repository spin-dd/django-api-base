[tool.poetry]
name = "apibase"
version = "0.1.0"
description = ""
authors = ["user.name <gmail@hdknr.com>"]

[tool.poetry.dependencies]
python = "^3.9"
graphene-django = "^2.10.1"
django-cors-headers = "^3.3.0"
djangorestframework-filters = { git = "https://github.com/philipn/django-rest-framework-filters.git" }
django-filter = "^2.2.0"
djangorestframework = "^3.11.0"
gql = "^2.0.0"
django-channels-graphql-ws = "^0.7.4"
jaconv = "^0.3.4"
djangorestframework-csv = "^2.1.0"
factory-boy = "^3.2.1"
ulid-py = "^1.1.0"
urllib3 = "^1.26.16"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
# devenv の `pkgs.ruff` と同じ版に固定する。git-hooks の ruff は nixpkgs の
# store path を直接叩くため、この版がずれると git-hooks だけが別版で整形し、
# treefmt (PATH 経由で .venv/bin/ruff) と CI と食い違う (#27)。
# devenv.lock を更新したら nixpkgs 側の版を確認して合わせること。
ruff = "0.14.9"
mypy = "^1.0"
# mypy が解決できない依存の型スタブ。無いと import-untyped で落ちる。
# 版を固定する。`*` にすると lock が Python 3.14 境界の marker 付き 2 エントリに
# 分かれ、CI のジョブごとに別版が入る（実際 3.10 のジョブに 3.14 向けが入っていた）。
# このプロジェクトの実効上限は 3.10 なので、3.14 側の枝は要らない。
types-PyYAML = "6.0.12.20250915"
types-six = "1.17.0.20251009"

[build-system]
requires = ["poetry>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 119
target-version = "py39"
exclude = [
  "migrations",
  ".mypy_cache",
  ".pytest_cache",
  ".tox",
  "venv",
  ".venv",
]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E203", # Whitespace before ':' (black compatibility)
  "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"web/costs/reports/__init__.py" = ["F401"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = ["apibase"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
exclude = ["migrations", ".mypy_cache", ".pytest_cache", ".tox", "venv"]

# `strict = true` ではない。strict は全関数に注釈を要求するので、現状 487 件
# (no-untyped-def 224 / no-untyped-call 173 が大半) 落ちる。Django/DRF/graphene に
# 型スタブが無いため注釈を入れても得られる検査は限定的で、割に合わない。
# 代わりに「注釈を要求しないが誤りは捕まえる」チェックだけを有効にしてある。
# この構成なら CI で強制でき、実際に強制している (#28)。
# 個別モジュールから strict にしていくことは可能。
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
