# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  # devenv.nix が git-hooks.hooks を使うので、input の宣言が要る。
  # 宣言が無いと devenv は lock から git-hooks ノードを削除したうえで
  # assertion に落ちる (#31)。
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Python 3.9 だけを取る。nixos-24.05 の python39 は cache.nixos.org に載る。
  # nixpkgs-python を nixpkgs に follows させるとキャッシュが当たらず、Python をソースからビルドしていた。
  nixpkgs-python39:
    url: github:NixOS/nixpkgs/nixos-24.05

cachix:
  enable: true
  caches:
    - devenv
    - nix-community
